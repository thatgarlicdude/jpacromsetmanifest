plugins {
	id 'java-library'
	id "com.vanniktech.maven.publish" version "0.37.0"
}

group = "io.github.thatgarlicdude"
version = "1.0.0"

repositories {
	mavenLocal()
	mavenCentral()
}

dependencies {
	testImplementation libs.junit
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(8)
	}
}

mavenPublishing {
	coordinates(group, 'jpacrommanifest', version)
	
	pom {
		name = "JPacROMManifest"
		description = "A Java library for reading and writing .pacrommanifest files."
		inceptionYear = "2026"
		url = "https://github.com/thatgarlicdude/jpacrommanifest"
		
		license {
			name = "The Apache License, Version 2.0"
			url = "http://www.apache.org/licenses/LICENSE-2.0.txt"
			distribution = "http://www.apache.org/licenses/LICENSE-2.0.txt"
		}
		
		developers {
			developer {
				id = "thatgarlicdude"
				name = "GarlicDude"
				url = "https://github.com/thatgarlicdude/"
			}
		}
		
		scm {
			url = "https://github.com/thatgarlicdude/jpacrommanifest"
			connection = "scm:git:git://github.com/thatgarlicdude/jpacrommanifest.git"
			developerConnection = "scm:git:ssh://git@github.com/thatgarlicdude/jpacrommanifest.git"
		}
	}
}
