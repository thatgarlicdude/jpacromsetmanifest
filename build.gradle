plugins {
	id 'java-library'
	id 'com.vanniktech.maven.publish' version '0.37.0'
}

group = "io.github.thatgarlicdude"
version = "1.0.0"

repositories {
	mavenLocal()
	mavenCentral()
}

dependencies {
	testImplementation libs.junit
}

java {
	sourceCompatibility = JavaVersion.VERSION_1_8
	targetCompatibility = JavaVersion.VERSION_1_8
	
	toolchain {
		languageVersion = JavaLanguageVersion.of(8)
	}
	
	withSourcesJar()
	withJavadocJar()
}

mavenPublishing {
	publishToMavenCentral()
	signAllPublications()
	
	checksums(Checksum.MD5, Checksum.SHA1, Checksum.SHA256, Checksum.SHA512)
	excludeSignatureChecksums(false)
	
	coordinates(group, 'jpacmanifest', version)
	
	pom {
		name = "JPacManifest"
		description = "A Java library for reading and writing PacManifest files."
		inceptionYear = "2026"
		url = "https://github.com/thatgarlicdude/jpacmanifest"
		
		license {
			name = "The Apache License, Version 2.0"
			url = "http://www.apache.org/licenses/LICENSE-2.0.txt"
			distribution = "http://www.apache.org/licenses/LICENSE-2.0.txt"
		}
		
		developers {
			developer {
				id = "thatgarlicdude"
				name = "GarlicDude"
				url = "https://github.com/thatgarlicdude/"
			}
		}
		
		scm {
			url = "https://github.com/thatgarlicdude/jpacmanifest"
			connection = "scm:git:git://github.com/thatgarlicdude/jpacmanifest.git"
			developerConnection = "scm:git:ssh://git@github.com/thatgarlicdude/jpacmanifest.git"
		}
	}
}
